<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive 3D Solar System | Created by @coding.stella</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Everything in space is drawn on this canvas by script.js -->
  <canvas id="space"></canvas>

  <header class="title">
    <h1>Solar System</h1>
    <p>Interactive 3D model</p>
  </header>

  <div class="controls panel">
    <div class="speed">
      <div class="speed-head">
        <label for="speed">Speed</label>
        <span id="speedVal">1.0×</span>
      </div>
      <input type="range" id="speed" min="0" max="5" step="0.1" value="1" />
    </div>
    <div class="divider"></div>
    <div class="buttons">
      <button id="pauseBtn" title="Pause">
        <svg viewBox="0 0 24 24">
          <path d="M8 5v14M16 5v14" />
        </svg>
      </button>
      <button id="orbitBtn" class="on" title="Toggle orbits">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8" />
          <circle cx="12" cy="12" r="1.5" />
        </svg>
      </button>
      <button id="labelBtn" class="on" title="Toggle labels">
        <svg viewBox="0 0 24 24">
          <path d="M5 7h14M5 12h10M5 17h7" />
        </svg>
      </button>
      <button id="resetBtn" title="Reset view">
        <svg viewBox="0 0 24 24">
          <path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v4h4" />
        </svg>
      </button>
      <a class="social-btn" href="https://github.com/rhande427-oss" target="_blank" rel="noreferrer" aria-label="GitHub profile" title="GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 .8C5.7.8.8 5.7.8 12c0 4.9 3.2 9 7.6 10.5.6.1.8-.2.8-.6v-2.1c-3.1.7-3.8-1.3-3.8-1.3-.5-1.3-1.2-1.6-1.2-1.6-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 .1 2-.7 2.4-1.1.1-.8.4-1.4.8-1.7-2.5-.3-5.2-1.3-5.2-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.6.1-3.3 0 0 1-.3 3.3 1.2 1-.3 2-.4 3-.4s2 .1 3 .4c2.3-1.5 3.3-1.2 3.3-1.2.6 1.7.2 3 .1 3.3.8.8 1.2 1.9 1.2 3.2 0 4.6-2.7 5.5-5.2 5.9.4.4.8 1.1.8 2.2v3.2c0 .4.2.7.8.6 4.4-1.5 7.6-5.6 7.6-10.5C23.2 5.7 18.3.8 12 .8Z" />
        </svg>
      </a>
      <a class="social-btn" href="https://rhande427-oss.github.io/Solar-System" target="_blank" rel="noreferrer" aria-label="Live demo" title="Live demo">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 8.5A2.5 2.5 0 0 1 7.5 6h9A2.5 2.5 0 0 1 19 8.5v7A2.5 2.5 0 0 1 16.5 18h-9A2.5 2.5 0 0 1 5 15.5v-7Zm7 1.5 4 2.5-4 2.5v-5Z" />
        </svg>
      </a>
    </div>
  </div>

  <!-- Planet buttons and info panel content are filled in by script.js -->
  <nav class="planet-bar panel" id="planetBar"></nav>

  <aside class="info panel" id="info">
    <button class="close" id="closeInfo" aria-label="Close">
      <svg viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>
    <div class="info-head">
      <span class="info-dot" id="infoDot"></span>
      <span class="info-type" id="infoType"></span>
    </div>
    <h2 id="infoName"></h2>
    <p class="info-desc" id="infoDesc"></p>
    <dl class="stats" id="infoStats"></dl>
    <div class="fact">
      <span>Did you know?</span>
      <p id="infoFact"></p>
    </div>
  </aside>

  <p class="hint" id="hint">Drag to rotate · Scroll to zoom · Click a planet</p>

  <script src="script.js"></script>
</body>

</html>
